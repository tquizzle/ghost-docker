name: Multi-PR

on:
  workflow_dispatch:

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Combine PRs
        uses: bobvanderlinden/combine-pull-requests@505d442a5e7ed578912a5e6276c10439425153d7 # v4
        with:
          label: multi-pr
          repo-token: ${{ secrets.GITHUB_TOKEN }}
